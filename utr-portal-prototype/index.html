<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Under The Radar — Participant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="assets/utr-logo.png" alt="Under The Radar" class="login-logo" />
      <h1>Participant Login</h1>
      <p class="muted">Enter your login ID to access your video portal.</p>
      <input type="text" id="loginInput" placeholder="e.g. thabo-utr3" autocomplete="off" />
      <button class="primary-btn" id="loginBtn">Log in</button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <div class="app-shell" id="appShell" style="display:none">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">UTR</div>
        <div>
          <div class="brand-name">UNDER THE RADAR</div>
          <div class="brand-sub">Participant Portal</div>
        </div>
      </div>
      <button class="ghost-btn" id="logoutBtn">Log out</button>
    </header>
    <main class="container">
      <section class="welcome">
        <div>
          <p class="eyebrow">BEHIND THE SCENES</p>
          <h1>Hi, <span id="participantName">Participant</span> 👋</h1>
          <p class="muted">Upload your content and music below. Add as many files as you like to each section.</p>
        </div>
        <div class="status-pill"><span class="status-dot"></span><span id="statusSummary">0 files uploaded</span></div>
      </section>

      <section class="categories-grid" id="categoriesGrid">
        <!-- Category cards are rendered here by app.js -->
      </section>

      <footer>Under The Radar · Participant submission portal</footer>
    </main>
  </div>

  <!-- Template for one category card, cloned per category by app.js -->
  <template id="categoryCardTemplate">
    <article class="category-card">
      <div class="category-head">
        <h2 class="category-title"></h2>
        <span class="category-count"></span>
      </div>
      <p class="category-description"></p>
      <div class="instruction-box">
        <div class="instruction-title">Before you upload</div>
        <ul class="category-instructions"></ul>
      </div>
      <div class="upload-zone">
        <input type="file" class="category-file-input" multiple hidden />
        <div class="upload-icon">↑</div>
        <button class="primary-btn category-choose-btn">Choose file(s)</button>
        <p class="category-hint"></p>
        <div class="file-state"></div>
      </div>
      <ul class="uploaded-files-list"></ul>
    </article>
  </template>

  <script src="prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
